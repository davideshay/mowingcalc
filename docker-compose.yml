version: "3.9"

services:
  mowingcalc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mowingcalc
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - mowingcalc-data:/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mowingcalc-data:
    driver: local
